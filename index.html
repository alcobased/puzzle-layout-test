<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Containment Test</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <div id="app-container">
    <nav class="navbar">
      <div class="navbar-brand">
        <a href="#" class="navbar-item">Logo</a>
      </div>
      <div class="navbar-menu">
        <div class="navbar-start">
          <a href="#" class="navbar-item">Home</a>
          <a href="#" class="navbar-item">About</a>
          <a href="#" class="navbar-item">Contact</a>
        </div>
      </div>
    </nav>
    <div id="image-container">
      <img id="puzzle-image" src="" alt="Puzzle Image" style="display: none;">
      <div id="image-overlay"></div>
    </div>
    <div id="control-panel">
        <button id="toggle-image-button" class="control-button">Load Image</button>
        <button id="reset-circles-button" class="control-button">Reset Circles</button>
        <input type="file" id="image-input" accept="image/*" style="display: none;">
    </div>
  </div>
  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
